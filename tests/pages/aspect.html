<!doctype html><html><head><style>
body{margin:8px;font:14px/20px monospace}div{background:#cde}
.a{width:200px;aspect-ratio:4/3;margin-bottom:6px}.b{width:120px;aspect-ratio:2;margin-bottom:6px}
.bb{width:200px;aspect-ratio:1/1;padding:10px;border:5px solid #333;box-sizing:border-box;margin-bottom:6px}
.cb{width:200px;aspect-ratio:1/1;padding:10px;border:5px solid #333;margin-bottom:6px}
.wrap{width:300px;position:relative;background:#eee;margin-bottom:6px}.full{aspect-ratio:3/1}.abs{position:absolute;inset:0;background:#f99}
.f{display:flex;gap:4px;width:300px;align-items:flex-start;margin-bottom:6px}.f>div{flex:1;aspect-ratio:1}
.fl{float:left;width:60px;aspect-ratio:1/2;margin-right:4px}.ib{display:inline-block;width:50px;aspect-ratio:5/2}
.h{height:30px;width:100px;aspect-ratio:1;margin-bottom:6px}
img.r{width:100px;aspect-ratio:16/9;display:block;margin-bottom:6px;background:#999}
</style></head><body>
<div class=a></div><div class=b></div><div class=bb></div><div class=cb></div>
<div class=wrap><div class=full></div><div class=abs></div></div>
<div class=f><div></div><div></div><div></div></div>
<div style="overflow:hidden;background:none"><div class=fl></div><div class=fl></div></div>
<div style=background:none><span class=ib></span> <span class=ib></span></div>
<div class=h></div>
<img class=r alt="">
</body></html>
