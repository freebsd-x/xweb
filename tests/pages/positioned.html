<!doctype html><html><head><style>
body{margin:0;font:14px/18px monospace}
.rel{position:relative;left:10px;top:5px;width:200px;height:50px}
.abs{position:absolute;left:20px;top:30px;width:50px;height:20px}
.abr{position:absolute;right:10px;bottom:10px;width:30px;height:30px}
.host{position:relative;width:300px;height:100px;border:2px solid;padding:3px}
.stat{position:absolute;width:10px;height:10px}
.fx{position:fixed;top:0;left:50%;width:10%;height:5px}
.sh{position:absolute;left:0;top:300px}
</style></head><body>
<div class=rel>rel</div><div class=host><div class=abs></div><div class=abr></div>text<div class=stat></div></div>
<div class=abs></div><div class=fx></div><div class=sh>shrink to my text</div><div style="height:20px">after</div>
<div style="width:100px;height:30px;background:#9c9;transform:translate(20px,-50%)"></div>
<div style="width:60px;height:20px;background:#99c;transform:translateX(50%) translateY(calc(4px + 10%))"></div>
<div style="width:60px;height:20px;background:#c99;translate:10px 5px"></div>
<div style="position:relative;height:40px"><span style="position:absolute;left:0;top:50%;width:16px;height:16px;background:#c9c;transform:translateY(-50%)"></span></div>
<div style="width:60px;height:30px;margin:20px;background:#3a7;transform:rotate(30deg)"></div>
<div style="width:60px;height:30px;margin:20px;background:#a37;transform:scale(1.5,.5) skewX(10deg)"></div>
<div style="width:40px;height:20px;margin:20px;background:linear-gradient(90deg,red,blue);transform-origin:0 0;rotate:90deg"></div>
<div style="width:30px;height:30px;margin:20px;transform:rotate(180deg)"><div style="width:10px;height:10px;background:#333"></div></div>
</body></html>
