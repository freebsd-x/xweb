<!doctype html><html><head><style>
*{font:14px/18px monospace}body{margin:0}
.w{width:50%;padding:10px;border:2px solid;margin:4px}
.bb{box-sizing:border-box;width:300px;padding:20px;border:5px solid;height:100px}
.mm{min-width:400px;max-width:200px;height:10px}.mx{max-width:150px;height:10px}.mn{min-height:33px}
.c{width:calc(100% - 40px);margin-left:calc(10px + 1em);height:6px}
.rem{width:10rem;height:2em;padding:1em}.pct{height:50%}.fix{height:200px}
</style></head><body>
<div class=w>half</div><div class=bb>border box</div><div class=mm></div><div class=mx></div><div class=mn></div><div class=c></div>
<div class=rem></div><div class=fix><div class=pct></div></div>
<div style="width:300px"><div style="width:50%;height:5px"></div><div style="padding-left:10%;height:5px"></div></div>
</body></html>
