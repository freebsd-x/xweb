<!doctype html><html><head><style>
*{font:14px/18px monospace}body{margin:0}
.w{width:50%;padding:10px;border:2px solid;margin:4px}
.bb{box-sizing:border-box;width:300px;padding:20px;border:5px solid;height:100px}
.mm{min-width:400px;max-width:200px;height:10px}.mx{max-width:150px;height:10px}.mn{min-height:33px}
.c{width:calc(100% - 40px);margin-left:calc(10px + 1em);height:6px}
.rem{width:10rem;height:2em;padding:1em}.pct{height:50%}.fix{height:200px}
</style></head><body>
<div class=w>half</div><div class=bb>border box</div><div class=mm></div><div class=mx></div><div class=mn></div><div class=c></div>
<div class=rem></div><div class=fix><div class=pct></div></div>
<div style="width:300px"><div style="width:50%;height:5px"></div><div style="padding-left:10%;height:5px"></div></div>
<!-- A gradient in a box with rounded corners is rounded too (naver.com's pill buttons). -->
<div style="position:relative;width:71px;height:40px;margin:6px"><div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;border-radius:117px;background:linear-gradient(292deg,#9cf 52%,#9fc 77%)"></div></div>
<div style="width:120px;height:30px;margin:6px;border-radius:15px;background:linear-gradient(90deg,#f80,#08f)"></div>
<!-- Auto margins between both offsets centre a positioned box (musinsa.com's floating
     bar: left 0, right 0, max-width, margin 0 auto); too little room, the right gives. -->
<div style="position:relative;width:400px;height:130px">
<div style="position:absolute;left:0;right:0;top:0;max-width:200px;margin:0 auto;height:20px;background:#09f"></div>
<div style="position:absolute;left:0;right:0;top:25px;width:100px;margin:0 auto;height:20px;background:#f90"></div>
<div style="position:absolute;left:0;right:0;top:50px;max-width:150px;margin-left:auto;height:20px;background:#0c0"></div>
<div style="position:absolute;left:0;right:0;top:75px;min-width:600px;max-width:100px;margin:0 auto;height:20px;background:#c0c"></div>
<div style="position:absolute;left:10px;right:10px;top:0;bottom:0;width:50px;height:30px;margin:auto;background:#333"></div>
</div>
</body></html>
